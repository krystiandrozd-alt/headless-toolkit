<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Headless Map — Salesforce AIforce learning hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400&family=Inter+Tight:wght@400&family=Inter:wght@400&family=Instrument+Serif:ital@1&display=swap">
<style>
/* ===== Enxoo design tokens (from Agentic Enterprise Map) ===== */
:root,[data-theme="light"]{--bg:#ffffff;--surface-1:#f5f5ff;--surface-2:#ebebff;--surface-inverse:#20204d;--text:#000080;--text-muted:#5e5ec9;--text-inverse:#e8e8ff;--border:#8989bd;--accent:#0000ff;--accent-hover:#0000bf;--focus:#0000ff;--cta:#00d4ff;--cta-hover:#00c3eb;--cta-fg:#000080;--secondary:#e0e0ff;--secondary-hover:#ccccff;--disabled:#e3e3ee;--disabled-fg:#7f7fa9;--scrim:rgba(0,0,128,.55);--pastel-blue:#e4e4ff;--ink-blue:#0000ff;--pastel-cyan:#def9ff;--ink-cyan:#007188;--pastel-mint:#cbffee;--ink-mint:#00774f;--pastel-gold:#fff5c2;--ink-gold:#7b6600;--pastel-pink:#ffdcee;--ink-pink:#cc0066;--pastel-coral:#ffdede;--ink-coral:#d20000;--pastel-orange:#ffe0ca;--ink-orange:#ae4900;--focus-ring:0 0 0 2px #ffffff,0 0 0 4px #0000ff;--elevation-overlay:0 2px 6px -1px rgba(0,0,128,.14),0 8px 20px -4px rgba(0,0,128,.14)}
[data-theme="dark"]{--bg:#0a0a20;--surface-1:#141437;--surface-2:#20204d;--surface-inverse:#ebebff;--text:#e8e8ff;--text-muted:#8f8fd8;--text-inverse:#000080;--border:#6969a7;--accent:#00d4ff;--accent-hover:#8ee5ff;--focus:#00d4ff;--cta:#00d4ff;--cta-hover:#8ee5ff;--cta-fg:#14143d;--secondary:#3c3c70;--secondary-hover:#525290;--disabled:#2c2c44;--disabled-fg:#73739d;--scrim:rgba(0,0,0,.7);--pastel-blue:#000074;--ink-blue:#b0b0ff;--pastel-cyan:#002228;--ink-cyan:#adf1ff;--pastel-mint:#002317;--ink-mint:#6affcd;--pastel-gold:#231d00;--ink-gold:#ffe66a;--pastel-pink:#420021;--ink-pink:#ff97cb;--pastel-coral:#450000;--ink-coral:#ff9c9c;--pastel-orange:#331500;--ink-orange:#ffa15e;--focus-ring:0 0 0 2px #0a0a20,0 0 0 4px #00d4ff;--elevation-overlay:0 2px 6px -1px rgba(0,0,0,.55),0 8px 20px -4px rgba(0,0,0,.55)}
:root{--space-xs:8px;--space-sm:12px;--space-md:16px;--space-lg:24px;--space-xl:32px;--space-2xl:48px;--space-3xl:64px;--radius-sm:6px;--radius-md:12px;--radius-lg:16px;--radius-full:1024px;--touch:44px;--font-heading:'Gabarito',Arial,sans-serif;--font-body:'Inter Tight',Arial,sans-serif;--font-small:'Inter',Arial,sans-serif;--font-accent:'Instrument Serif',Georgia,serif;--header-h:64px}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header-h) + 16px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:400;margin:0;color:var(--text)}
b,strong,th{font-weight:400}
strong{color:var(--text);background:linear-gradient(transparent 62%,var(--pastel-cyan) 62%)}
em,i{font-style:normal}
a{color:var(--accent)}
a:hover{color:var(--accent-hover)}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--radius-sm)}
.accent{font-family:var(--font-accent);font-style:italic;color:var(--accent)}
.muted{color:var(--text-muted)}
.small{font:400 12px/1.35 var(--font-small)}
svg.i{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i16{width:16px;height:16px}

/* ===== Header ===== */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--header-h);display:flex;align-items:center;gap:var(--space-md);padding:0 var(--space-lg);background:var(--bg);border-bottom:1px solid var(--surface-2)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font:400 20px/1 var(--font-heading);white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--bg)}
.brand-mark svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none}
.brand small{font:400 12px var(--font-small);color:var(--text-muted);margin-left:4px}
.search{position:relative;flex:1;max-width:480px;margin-left:auto}
.search-box{display:flex;align-items:center;gap:8px;height:var(--touch);padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg)}
.search-box:focus-within{border:2px solid var(--accent);padding:0 11px}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit}
.search-box input::placeholder{color:var(--text-muted)}
.kbd{font:400 12px var(--font-small);color:var(--text-muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:60vh;overflow:auto;padding:8px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--elevation-overlay);display:none}
.results.open{display:block}
.res{display:block;padding:10px 12px;border-radius:var(--radius-md);text-decoration:none;color:var(--text)}
.res:hover,.res.sel{background:var(--secondary)}
.res span{display:block;font:400 12px/1.4 var(--font-small);color:var(--text-muted);margin-top:2px}
.icon-btn{width:var(--touch);height:var(--touch);display:inline-grid;place-items:center;border:0;border-radius:var(--radius-md);background:transparent;color:var(--text);cursor:pointer}
.icon-btn:hover{background:var(--secondary)}
.menu-btn{display:none}

/* ===== Layout ===== */
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:calc(100vh - var(--header-h))}
.side{position:sticky;top:calc(var(--header-h) + env(safe-area-inset-top,0px));height:calc(100vh - var(--header-h));overflow:auto;padding:var(--space-lg) var(--space-md) var(--space-2xl);border-right:1px solid var(--surface-2);background:var(--bg)}
.side-label{font:400 12px var(--font-small);color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;padding:0 12px;margin:var(--space-lg) 0 6px}
.side-label:first-child{margin-top:0}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 4px}
.track-btn{min-height:40px;border:1px solid var(--border);border-radius:var(--radius-full);background:transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer;padding:0 12px}
.track-btn:hover{background:var(--secondary)}
.track-btn.on{background:var(--secondary);border-color:var(--secondary)}
.nav-group{margin-top:4px}
.nav-part{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;font:400 15px var(--font-heading);color:var(--text)}
.nav-part .num{font:400 12px var(--font-small);color:var(--text-muted);min-width:22px}
.nav-sub{font:400 12px var(--font-small);color:var(--text-muted);padding:6px 12px 2px 42px}
.nav-item{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px 6px 42px;border-radius:var(--radius-md);color:var(--text);text-decoration:none;font-size:15px;line-height:1.25}
.nav-item:hover{background:var(--secondary)}
.nav-item.on{background:var(--secondary);box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;flex:none}
.nav-item.soon{color:var(--disabled-fg);pointer-events:none}
.nav-item.soon .soon-t{margin-left:auto;font:400 11px var(--font-small)}
main{min-width:0;padding:var(--space-xl) var(--space-2xl) var(--space-3xl)}
.wrap{max-width:880px}
.wide{max-width:1100px}
.scrim{display:none}

/* ===== Components ===== */
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--radius-full);font-size:14px;white-space:nowrap;border:1px solid transparent}
.b-ga{background:var(--pastel-mint);color:var(--ink-mint)}
.b-beta,.b-pilot,.b-developer-preview{background:var(--pastel-gold);color:var(--ink-gold)}
.b-announced{background:var(--pastel-coral);color:var(--ink-coral)}
.b-mixed{background:var(--pastel-blue);color:var(--ink-blue)}
.b-na{background:var(--surface-2);color:var(--text-muted)}
.b-out{border-color:var(--border);color:var(--text)}
.dot.b-ga{background:var(--ink-mint)}.dot.b-beta{background:var(--ink-gold)}.dot.b-announced{background:var(--ink-coral)}.dot.b-mixed{background:var(--ink-blue)}.dot.b-na{background:var(--border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--touch);padding:0 var(--space-lg);border-radius:var(--radius-md);border:1px solid transparent;font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--cta);color:var(--cta-fg)}.btn-primary:hover{background:var(--cta-hover);color:var(--cta-fg)}
.btn-secondary{background:var(--secondary);color:var(--text)}.btn-secondary:hover{background:var(--secondary-hover);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--text)}.btn-ghost:hover{background:var(--secondary);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--radius-full);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:14px}
.chip:hover{background:var(--secondary);color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface-1);border-radius:var(--radius-lg);padding:var(--space-lg);display:flex;flex-direction:column;gap:var(--space-sm);color:var(--text);text-decoration:none}
a.card:hover{background:var(--surface-2);color:var(--text)}
.tile{width:44px;height:44px;border-radius:var(--radius-md);display:grid;place-items:center}
.t-blue{background:var(--pastel-blue);color:var(--ink-blue)}.t-cyan{background:var(--pastel-cyan);color:var(--ink-cyan)}.t-mint{background:var(--pastel-mint);color:var(--ink-mint)}.t-gold{background:var(--pastel-gold);color:var(--ink-gold)}.t-pink{background:var(--pastel-pink);color:var(--ink-pink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-md)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-md)}

/* ===== Home ===== */
.hero{padding:var(--space-xl) 0 var(--space-2xl);display:flex;flex-direction:column;gap:var(--space-md)}
.hero h1{font-size:56px;line-height:1.05;max-width:820px}
.lead{font-size:20px;line-height:1.5;color:var(--text-muted);max-width:680px;margin:0}
.sec{margin-top:var(--space-2xl)}
.sec-head{display:flex;align-items:baseline;gap:var(--space-md);margin-bottom:var(--space-md)}
.sec-head h2{font-size:32px;line-height:1.15}
.sec-head p{margin:0;color:var(--text-muted)}
.card h3{font-size:22px;line-height:1.2}
.card p{margin:0;color:var(--text-muted);line-height:1.45}
.card .go{margin-top:auto;display:flex;align-items:center;gap:6px;color:var(--accent)}

/* Layer map */
.map{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:var(--space-xs)}
.layers{display:flex;flex-direction:column;gap:var(--space-xs)}
.layer{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--space-xs)}
.layer-name{background:var(--surface-2);border-radius:var(--radius-md);padding:12px 16px;display:flex;flex-direction:column;justify-content:center}
.layer-name b{font:400 17px var(--font-heading)}
.layer-name span{font:400 12px/1.35 var(--font-small);color:var(--text-muted)}
.layer-items{display:flex;flex-wrap:wrap;gap:var(--space-xs);background:var(--surface-1);border-radius:var(--radius-md);padding:10px;align-content:center}
.node{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--radius-md);background:var(--bg);color:var(--text);text-decoration:none;border:1px solid var(--surface-2);font-size:15px}
a.node:hover{border-color:var(--accent);color:var(--accent)}
.node.static{color:var(--text-muted)}
.node.soon{color:var(--disabled-fg);border-style:dashed}
.layer.surfaces .layer-items{background:transparent;border:1px dashed var(--border)}
.harness{background:var(--surface-1);border:1px dashed var(--ink-coral);color:var(--text);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:8px;justify-content:center;text-align:center}
.harness b{font:400 17px var(--font-heading)}
.harness span{font:400 12px/1.4 var(--font-small);color:var(--text-muted)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-md);align-items:center;margin-top:var(--space-md);color:var(--text-muted);font-size:14px}

/* ===== Path ===== */
.steps{display:flex;flex-direction:column;gap:var(--space-xs);counter-reset:s}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--space-md);align-items:center;padding:var(--space-md);border-radius:var(--radius-lg);background:var(--surface-1);text-decoration:none;color:var(--text)}
.step:hover{background:var(--surface-2);color:var(--text)}
.step-n{width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:400 18px var(--font-heading);color:var(--accent)}
.step b{font:400 19px var(--font-heading);display:block}
.step p{margin:2px 0 0;color:var(--text-muted);font-size:14px;line-height:1.4}

/* ===== Article ===== */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--text-muted);margin-bottom:var(--space-md)}
.crumbs a{color:var(--accent);text-decoration:none}
.art-head h1{font-size:40px;line-height:1.1;margin-bottom:var(--space-md)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--space-lg)}
.pathbar{display:flex;align-items:center;gap:var(--space-sm);padding:10px 12px 10px 16px;background:var(--surface-1);border-radius:var(--radius-md);margin-bottom:var(--space-xl);font-size:14px}
.pathbar .bar{flex:1;height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.pathbar .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.prose{font-size:17px;line-height:1.6}
.prose h2{font-size:28px;line-height:1.2;margin:var(--space-2xl) 0 var(--space-sm);padding-top:var(--space-md);border-top:1px solid var(--surface-2)}
.prose h2:first-child{margin-top:0;border-top:0;padding-top:0}
.prose h3{font-size:21px;margin:var(--space-xl) 0 var(--space-xs)}
.prose p,.prose ul,.prose ol{margin:0 0 var(--space-md)}
.prose li{margin:4px 0}
.prose code{font:400 .88em ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);padding:1px 6px;border-radius:6px}
.prose pre{background:var(--surface-inverse);color:var(--text-inverse);padding:var(--space-md);border-radius:var(--radius-md);overflow:auto}
.prose pre code{background:transparent;color:inherit;padding:0}
.prose a{text-underline-offset:2px}
.prose hr{border:0;border-top:1px solid var(--surface-2);margin:var(--space-xl) 0}
.prose em{font-style:normal;color:var(--text-muted);font-size:.92em}
.note{margin:0 0 var(--space-md);padding:var(--space-md);background:var(--pastel-blue);border:1px solid var(--ink-blue);border-radius:var(--radius-lg);color:var(--text)}
.note p:last-child{margin:0}
.tbl{overflow-x:auto;margin:0 0 var(--space-lg);border-radius:var(--radius-md);border:1px solid var(--surface-2)}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.45}
.tbl th{background:var(--surface-2);color:var(--text-muted);text-align:left;padding:10px 14px;font:400 13px var(--font-small);white-space:nowrap}
.tbl td{padding:10px 14px;border-top:1px solid var(--surface-2);vertical-align:top}
.tag-inf{display:inline-block;font:400 12px var(--font-small);background:var(--pastel-gold);color:var(--ink-gold);border-radius:var(--radius-full);padding:2px 10px;vertical-align:1px}
.acc{margin-top:var(--space-xl);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:56px;cursor:pointer;font:400 19px var(--font-heading)}
.acc summary::-webkit-details-marker{display:none}
.acc summary .chev{margin-left:auto;transition:transform .15s}
.acc[open] summary .chev{transform:rotate(180deg)}
.acc .prose{font-size:15px;padding-bottom:var(--space-md)}
.related{margin-top:var(--space-xl)}
.related h3{font-size:19px;margin-bottom:var(--space-sm)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);margin-top:var(--space-2xl)}
.pager a{display:flex;flex-direction:column;gap:4px;padding:var(--space-md);border-radius:var(--radius-lg);border:1px solid var(--surface-2);text-decoration:none;color:var(--text)}
.pager a:hover{background:var(--surface-1);color:var(--text)}
.pager a span{font:400 12px var(--font-small);color:var(--text-muted)}
.pager a.next{text-align:right}
.foot{margin-top:var(--space-2xl);padding-top:var(--space-md);border-top:1px solid var(--surface-2);display:flex;flex-wrap:wrap;gap:var(--space-md);font:400 12px var(--font-small);color:var(--text-muted)}
.filter{margin-bottom:var(--space-lg)}

/* ===== Responsive ===== */
@media (max-width:1023px){main{padding:var(--space-lg)}.grid3{grid-template-columns:1fr 1fr}.layer{grid-template-columns:150px minmax(0,1fr)}}
@media (max-width:860px){
 .menu-btn{display:inline-grid}
 .brand small{display:none}
 .layout{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:calc(var(--header-h) + env(safe-area-inset-top,0px));bottom:0;width:300px;height:auto;z-index:25;transform:translateX(-100%);transition:transform .2s ease-out}
 body.nav-open .side{transform:none}
 body.nav-open .scrim{display:block;position:fixed;inset:0;top:var(--header-h);background:var(--scrim);z-index:20}
 .hero h1{font-size:40px}
 .map{grid-template-columns:1fr}
 .grid3,.grid2{grid-template-columns:1fr}
 .kbd{display:none}
}
@media (max-width:600px){.hdr{padding:0 var(--space-sm);gap:8px}.brand span.t{display:none}.layer{grid-template-columns:1fr}.art-head h1{font-size:32px}.pager{grid-template-columns:1fr}.step{grid-template-columns:36px minmax(0,1fr)}.step>svg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hdr">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="brand" href="#home"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 12l8 4.5 8-4.5"/><path d="M4 16.5l8 4.5 8-4.5"/></svg></span><span class="t">Headless Map</span><small>Enxoo learning hub</small></a>
  <div class="search">
    <label class="search-box"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="Search topics and terms" autocomplete="off" aria-label="Search"><span class="kbd">/</span></label>
    <div class="results" id="results" role="listbox"></div>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>
<div class="layout">
  <aside class="side" id="side" aria-label="Navigation">
    <div class="side-label">My track</div>
    <div class="tracks" id="tracks"></div>
    <div class="side-label">Contents</div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main id="main"></main>
</div>
<script>
const DOCS = /*__DATA__*/[];
const BY = Object.fromEntries(DOCS.map(d => [d.id, d]));
const PARTS = [
  {p:'0', n:'0', label:'Start here'},
  {p:'1', n:'1', label:'The big picture'},
  {p:'2', n:'2', label:'Building blocks', subs:[['2.1','Data and context'],['2.2','Security and trust'],['2.3','Business logic'],['2.4','Agents'],['2.5','Connectivity'],['2.6','Experience'],['2.7','AI Harness']]},
  {p:'3', n:'3', label:'How it works together'},
  {p:'4', n:'4', label:'Building it'},
  {p:'5', n:'5', label:'Business view'},
  {p:'6', n:'6', label:'Reference'}
];
const PLANNED = {'2.2':'Security and trust','2.3':'Business logic','2.7':'Enterprise AI Harness'};
const TRACKS = {
  all:{label:'All', desc:'Everything in the hub'},
  core:{label:'Core', desc:'For every Enxoo employee: what headless is and why it matters', tile:'t-blue',
    path:['why-headless-360','get-started','request-journeys','aiforce-claudeforce','agentforce','data-360','hosted-mcp-servers','use-cases-telco','licensing-and-commercial','glossary']},
  developer:{label:'Developer', desc:'Build and deploy: MCP, agents, HXL widgets, React apps', tile:'t-cyan',
    path:['get-started','why-headless-360','request-journeys','hosted-mcp-servers','agentforce','data-360','headless-experience-layer-hxl-beta','multi-framework-microfrontend','multi-framework-react-launch','glossary','verification-log']},
  presales:{label:'Presales', desc:'Position, qualify and sell without overpromising', tile:'t-mint',
    path:['why-headless-360','aiforce-claudeforce','request-journeys','use-cases-telco','licensing-and-commercial','salesforce-in-claude-skills','agentforce','data-360','hosted-mcp-servers','glossary']}
};
for (const t of Object.values(TRACKS)) if (t.path) t.path = t.path.filter(id => BY[id]);
const STATUS = {ga:'GA',beta:'Beta',pilot:'Pilot','developer-preview':'Developer preview',announced:'Announced',mixed:'Mixed status','n/a':'Not a product'};
const sKey = s => (s === 'n/a' || !s) ? 'na' : s;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {
  arrow:'<svg class="i i16" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  left:'<svg class="i i16" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  chev:'<svg class="i chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  ext:'<svg class="i i16" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  users:'<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>',
  code:'<svg class="i" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>',
  brief:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>'
};
let track = 'all';
try { track = localStorage.getItem('hm-track') || 'all'; } catch(e) {}
try { const th = localStorage.getItem('hm-theme'); if (th) document.documentElement.dataset.theme = th; else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch(e) {}

const inTrack = d => track === 'all' || (d.tracks || []).includes(track);
const partOf = d => d.part.startsWith('2.') ? '2' : d.part;
const levelLabel = l => l ? ({101:'101 · Orientation',201:'201 · Practitioner',301:'301 · Deep dive'}[l] || l) : '';
const badge = s => `<span class="badge b-${sKey(s)}">${STATUS[s] || esc(s)}</span>`;

function renderTracks(){
  document.getElementById('tracks').innerHTML = Object.entries(TRACKS).map(([k,t]) =>
    `<button class="track-btn ${k===track?'on':''}" data-track="${k}" aria-pressed="${k===track}">${t.label}</button>`).join('');
}
function renderNav(cur){
  let h = '';
  for (const P of PARTS) {
    const docs = DOCS.filter(d => partOf(d) === P.p && inTrack(d));
    const plannedHere = P.subs ? P.subs.filter(([s]) => PLANNED[s]) : [];
    if (!docs.length && !plannedHere.length) continue;
    h += `<div class="nav-group"><div class="nav-part"><span class="num">${P.n}</span>${P.label}</div>`;
    if (P.p === '0') h += `<a class="nav-item ${cur==='home'?'on':''}" href="#home">Overview and map</a>`;
    if (P.subs) {
      for (const [s, label] of P.subs) {
        const sd = docs.filter(d => d.part === s);
        if (!sd.length && !PLANNED[s]) continue;
        h += `<div class="nav-sub">${s} ${label}</div>`;
        h += sd.map(item(cur)).join('');
        if (!sd.length) h += `<span class="nav-item soon">${label}<span class="soon-t">Planned</span></span>`;
      }
    } else h += docs.map(item(cur)).join('');
    if (P.p === '0' && track !== 'all') h += `<a class="nav-item ${cur==='path-'+track?'on':''}" href="#path-${track}">My learning path</a>`;
    h += '</div>';
  }
  document.getElementById('nav').innerHTML = h;
}
const item = cur => d => `<a class="nav-item ${cur===d.id?'on':''}" href="#${d.id}">${esc(d.title.replace(/ — .*/, ''))}<i class="dot b-${sKey(d.status)}" title="${STATUS[d.status]||''}"></i></a>`;

function nodeLink(id, label){ return BY[id] ? `<a class="node" href="#${id}">${label}</a>` : `<span class="node soon">${label}</span>`; }
function home(){
  const trackCards = ['core','developer','presales'].map((k,i) => {
    const t = TRACKS[k];
    return `<a class="card" href="#path-${k}" data-set-track="${k}"><span class="tile ${t.tile}">${[ICON.users,ICON.code,ICON.brief][i]}</span><h3>${t.label}</h3><p>${t.desc}</p><span class="go">${t.path.length} steps ${ICON.arrow}</span></a>`;
  }).join('');
  return `<div class="wide">
  <section class="hero">
    <h1>Salesforce goes <span class="accent">headless</span>. Learn what it means.</h1>
    <p class="lead">One place to understand AIforce (formerly Headless 360), Agentforce, MCP and the Headless Toolkit: the technology, the business case and what we can sell today. Every fact links to official Salesforce documentation.</p>
    <div class="row"><a class="btn btn-primary" href="#request-journeys">Start with 3 short stories ${ICON.arrow}</a><a class="btn btn-ghost" href="#glossary">Open the glossary</a></div>
  </section>
  <section class="sec"><div class="sec-head"><h2>Choose your <span class="accent">track</span></h2></div><div class="grid3">${trackCards}</div></section>
  <section class="sec">
    <div class="sec-head"><h2>The map</h2><p>Click any box to open the topic.</p></div>
    <div class="map">
      <div class="layers">
        <div class="layer surfaces"><div class="layer-name"><b>Where people work</b><span>Surfaces outside Salesforce screens</span></div>
          <div class="layer-items"><span class="node static">Claude</span><span class="node static">ChatGPT</span><span class="node static">Slack / Slackbot</span><span class="node static">Lightning</span><span class="node static">Portals and apps</span><span class="node static">Coding tools</span></div></div>
        <div class="layer"><div class="layer-name"><b>2.6 Experience</b><span>How results are shown</span></div>
          <div class="layer-items">${nodeLink('headless-experience-layer-hxl-beta','HXL widgets')}${nodeLink('multi-framework-microfrontend','Multi-Framework (React, Angular)')}${nodeLink('multi-framework-microfrontend','UI Embedding')}</div></div>
        <div class="layer"><div class="layer-name"><b>2.5 Connectivity</b><span>How AI reaches Salesforce</span></div>
          <div class="layer-items">${nodeLink('hosted-mcp-servers','Hosted MCP Servers')}${nodeLink('hosted-mcp-servers','Headless 360 MCP')}${nodeLink('data-360','Data 360 MCP')}${nodeLink('get-started','APIs and CLI')}<span class="node soon">A2A</span></div></div>
        <div class="layer"><div class="layer-name"><b>2.4 Agents</b><span>Reasoning and actions</span></div>
          <div class="layer-items">${nodeLink('agentforce','Agentforce')}${nodeLink('agentforce','Agent Script')}${nodeLink('agentforce','Testing and ADLC')}${nodeLink('salesforce-in-claude-skills','Salesforce in Claude')}</div></div>
        <div class="layer"><div class="layer-name"><b>2.3 Business logic</b><span>Flows, Apex, industry processes</span></div>
          <div class="layer-items">${nodeLink('use-cases-telco','Communications Cloud agents')}<span class="node soon">Flows and Apex (planned)</span></div></div>
        <div class="layer"><div class="layer-name"><b>2.2 Security and trust</b><span>Same rules on every entry point</span></div>
          <div class="layer-items">${nodeLink('why-headless-360','Identity, access, scope, governance')}<span class="node soon">Einstein Trust Layer (planned)</span></div></div>
        <div class="layer"><div class="layer-name"><b>2.1 Data and context</b><span>What agents know</span></div>
          <div class="layer-items">${nodeLink('data-360','Data 360')}${nodeLink('data-360','Grounding and RAG')}${nodeLink('data-360','Zero Copy')}</div></div>
      </div>
      <div class="harness"><b>2.7 AI Harness</b><span>Announced at Dreamforce 2026. Governs own and third-party AI. Not yet in product documentation.</span><span class="badge b-announced" style="align-self:center">Announced</span></div>
    </div>
    <div class="legend"><span class="badge b-ga">GA</span><span class="badge b-beta">Beta</span><span class="badge b-announced">Announced</span><span class="badge b-mixed">Mixed status</span><span class="tag-inf">Interpretation</span><span>= our explanation, not a Salesforce statement</span></div>
  </section>
  <section class="sec"><div class="sec-head"><h2>Good to know</h2></div><div class="grid2">
    <a class="card" href="#licensing-and-commercial"><span class="tile t-gold">${ICON.brief}</span><h3>What must a client have?</h3><p>Flex Credits, direct Anthropic subscription for Claude, Beta terms, Hyperforce. The presales checklist.</p><span class="go">Licensing ${ICON.arrow}</span></a>
    <a class="card" href="#use-cases-telco"><span class="tile t-pink">${ICON.users}</span><h3>Telco use cases</h3><p>What Salesforce ships for Communications Cloud today, and which ideas are only proposals.</p><span class="go">Use cases ${ICON.arrow}</span></a>
  </div></section>
  ${footer()}
  </div>`;
}
function pathView(k){
  const t = TRACKS[k]; if (!t || !t.path) return home();
  const steps = t.path.map((id,i) => { const d = BY[id]; const first = d.summary || '';
    return `<a class="step" href="#${id}"><span class="step-n">${i+1}</span><div><b>${esc(d.title.replace(/ — .*/,''))}</b><p>${esc(first.trim().slice(0,170))}</p></div>${ICON.arrow}</a>`; }).join('');
  return `<div class="wrap"><div class="crumbs"><a href="#home">Home</a>›<span>${t.label} track</span></div>
  <div class="art-head"><h1>${t.label} <span class="accent">track</span></h1></div><p class="lead" style="margin-bottom:24px">${t.desc}. Follow the steps in order; each page shows your progress.</p>
  <div class="steps">${steps}</div>${footer()}</div>`;
}
function article(d){
  const P = PARTS.find(p => p.p === partOf(d));
  const sub = P && P.subs ? (P.subs.find(s => s[0] === d.part) || [])[1] : '';
  const path = track !== 'all' ? TRACKS[track].path : null;
  const idx = path ? path.indexOf(d.id) : -1;
  let pathbar = '', pager = '';
  if (idx >= 0) {
    pathbar = `<div class="pathbar"><span>${TRACKS[track].label} track · step ${idx+1} of ${path.length}</span><span class="bar"><i style="width:${Math.round((idx+1)*100/path.length)}%"></i></span><a href="#path-${track}">All steps</a></div>`;
    const prev = path[idx-1], next = path[idx+1];
    pager = `<div class="pager">${prev ? `<a href="#${prev}"><span>${ICON.left} Previous</span>${esc(BY[prev].title.replace(/ — .*/,''))}</a>` : '<i></i>'}${next ? `<a class="next" href="#${next}"><span>Next ${ICON.arrow}</span>${esc(BY[next].title.replace(/ — .*/,''))}</a>` : ''}</div>`;
  }
  const rel = (d.related || []).filter(r => BY[r] && r !== d.id).map(r => `<a class="chip" href="#${r}">${esc(BY[r].title.replace(/ — .*/,''))}</a>`).join('');
  const tracksB = (d.tracks || []).map(t => `<span class="badge b-out">${TRACKS[t] ? TRACKS[t].label : t}</span>`).join('');
  const filter = d.id === 'glossary' ? `<label class="search-box filter"><svg class="i" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><input id="gfilter" placeholder="Filter terms, e.g. MCP, credits, widget"></label>` : '';
  return `<article class="wrap">
    <div class="crumbs"><a href="#home">Home</a>›<span>${P ? P.label : ''}${sub ? ' › ' + sub : ''}</span></div>
    ${pathbar}
    <div class="art-head"><h1>${esc(d.title)}</h1></div>
    <div class="meta">${badge(d.status)}${d.level ? `<span class="badge b-na">${levelLabel(d.level)}</span>` : ''}${tracksB}${d.verified ? `<span class="small muted">Verified ${esc(d.verified)}</span>` : ''}</div>
    ${filter}
    <div class="prose" id="prose">${d.html}</div>
    ${d.docs_html ? `<details class="acc"><summary>Official documentation pages${ICON.chev}</summary><div class="prose">${d.docs_html}</div></details>` : ''}
    ${rel ? `<div class="related"><h3>Related</h3><div class="row">${rel}</div></div>` : ''}
    ${pager}
    <div class="foot"><a href="${d.src}" target="_blank" rel="noopener">Source file on GitHub ${ICON.ext}</a><span>Content: headless-toolkit repository</span></div>
  </article>`;
}
function footer(){ return `<div class="foot"><span>Headless Map · content from the headless-toolkit repository</span><a href="#verification-log">Verification log</a><a href="#information-architecture">How this hub is organised</a></div>`; }

function route(){
  const id = (location.hash || '#home').slice(1);
  const main = document.getElementById('main');
  let cur = id;
  if (id.startsWith('path-')) { const k = id.slice(5); if (TRACKS[k] && track !== k) setTrack(k, false); main.innerHTML = pathView(k); }
  else if (BY[id]) main.innerHTML = article(BY[id]);
  else { cur = 'home'; main.innerHTML = home(); }
  renderNav(cur);
  document.body.classList.remove('nav-open');
  window.scrollTo(0, 0);
  const g = document.getElementById('gfilter');
  if (g) g.addEventListener('input', () => {
    const v = g.value.toLowerCase();
    document.querySelectorAll('#prose tbody tr').forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(v) ? '' : 'none');
  });
}
function setTrack(k, rerender = true){
  track = k; try { localStorage.setItem('hm-track', k); } catch(e) {}
  renderTracks(); if (rerender) route();
}
document.getElementById('tracks').addEventListener('click', e => { const b = e.target.closest('[data-track]'); if (b) setTrack(b.dataset.track); });
document.addEventListener('click', e => { const c = e.target.closest('[data-set-track]'); if (c) { track = c.dataset.setTrack; try { localStorage.setItem('hm-track', track); } catch(err) {} renderTracks(); } });
window.addEventListener('hashchange', route);
document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('nav-open');
document.getElementById('scrim').onclick = () => document.body.classList.remove('nav-open');
document.getElementById('themeBtn').onclick = () => {
  const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = n; try { localStorage.setItem('hm-theme', n); } catch(e) {}
};
// Search
const q = document.getElementById('q'), res = document.getElementById('results');
let sel = 0, hits = [];
function search(v){
  v = v.trim().toLowerCase();
  if (v.length < 2) { res.classList.remove('open'); return; }
  hits = DOCS.map(d => { const t = d.title.toLowerCase(), x = d.text.toLowerCase(); const i = x.indexOf(v);
      return {d, score: (t.includes(v) ? 10 : 0) + (i >= 0 ? 1 : 0), snip: i >= 0 ? d.text.slice(Math.max(0, i-50), i+90) : ''}; })
    .filter(h => h.score > 0).sort((a,b) => b.score - a.score).slice(0, 8);
  sel = 0;
  res.innerHTML = hits.length ? hits.map((h,i) => `<a class="res ${i===0?'sel':''}" href="#${h.d.id}">${esc(h.d.title)}<span>${esc(h.snip ? '…' + h.snip + '…' : STATUS[h.d.status] || '')}</span></a>`).join('') : '<div class="res muted">No matches</div>';
  res.classList.add('open');
}
q.addEventListener('input', () => search(q.value));
q.addEventListener('keydown', e => {
  const items = res.querySelectorAll('a.res');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!items.length) return; items[sel].classList.remove('sel'); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items[sel].classList.add('sel'); }
  if (e.key === 'Enter' && items[sel]) { location.hash = items[sel].getAttribute('href'); q.value = ''; res.classList.remove('open'); q.blur(); }
  if (e.key === 'Escape') { res.classList.remove('open'); q.blur(); }
});
res.addEventListener('click', () => { q.value = ''; res.classList.remove('open'); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); q.focus(); } });
renderTracks(); route();
</script>
</body>
</html>
